<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Captain's Deck | Reel Irie Charters</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Captain's Deck">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>

  <header class="top">
    <img src="/images/wordmark-stacked.png" alt="Reel Irie Charters" class="logo" width="900" height="243">
    <div class="top-text">
      <p class="kicker">Captain's Deck</p>
      <p class="hello" id="hello">Ahoy, Captain</p>
    </div>
    <button class="icon-btn" id="refresh" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </header>

  <main class="wrap">
    <section class="stats" aria-label="At a glance">
      <button class="stat" data-jump="new"><strong id="st-new">0</strong><span>New requests</span></button>
      <button class="stat" data-jump="upcoming"><strong id="st-up">0</strong><span>Confirmed trips</span></button>
      <button class="stat" data-jump="upcoming"><strong id="st-week">0</strong><span>This week</span></button>
    </section>

    <!-- REQUESTS -->
    <section class="view" id="view-requests">
      <div class="chips" role="tablist" aria-label="Filter">
        <button class="chip is-on" data-filter="new" role="tab">New <b id="badge-new"></b></button>
        <button class="chip" data-filter="upcoming" role="tab">Upcoming</button>
        <button class="chip" data-filter="past" role="tab">Past</button>
        <button class="chip" data-filter="declined" role="tab">Declined</button>
      </div>
      <div id="list" class="list" aria-live="polite"></div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="view-calendar" hidden>
      <div class="cal-head">
        <button class="icon-btn" id="cal-prev" type="button" aria-label="Previous month">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <h2 id="cal-title">Month</h2>
        <button class="icon-btn" id="cal-next" type="button" aria-label="Next month">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </div>
      <div class="cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="cal" id="cal"></div>
      <div class="legend">
        <span><i class="lg-all"></i>All trips</span>
        <span><i class="lg-sunset"></i>Sunset only</span>
        <span><i class="lg-off"></i>Off / booked</span>
        <span><i class="lg-dot"></i>Has a booking</span>
      </div>
      <p class="hint">Tap a day to change it. The website updates within a minute.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab is-on" data-view="requests">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.2L4 17.5z"/><path d="M8 9h8M8 12h5"/></svg>
      Requests <b id="tab-badge"></b>
    </button>
    <button class="tab" data-view="calendar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Calendar
    </button>
    <a class="tab" href="/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      Website
    </a>
  </nav>

  <!-- Confirm / decline sheet -->
  <dialog class="sheet" id="act-sheet">
    <form method="dialog" class="sheet-body" id="act-form">
      <h3 id="act-title">Confirm trip?</h3>
      <p class="sheet-sub" id="act-sub"></p>
      <label class="check" id="act-block-row"><input type="checkbox" id="act-block" checked> <span id="act-block-label">Mark this day booked on the website</span></label>
      <label class="check"><input type="checkbox" id="act-text" checked> <span id="act-text-label">Text them now</span></label>
      <div class="sheet-actions">
        <button value="cancel" class="btn btn-ghost" type="submit">Never mind</button>
        <button value="ok" class="btn btn-primary" id="act-ok" type="submit">Confirm</button>
      </div>
    </form>
  </dialog>

  <!-- Day sheet -->
  <dialog class="sheet" id="day-sheet">
    <form method="dialog" class="sheet-body" id="day-form">
      <h3 id="day-title">Day</h3>
      <p class="sheet-sub" id="day-normal"></p>
      <div class="day-opts" id="day-opts" role="radiogroup" aria-label="Day status">
        <label><input type="radio" name="dstatus" value=""><span>Normal</span></label>
        <label><input type="radio" name="dstatus" value="open"><span>All trips</span></label>
        <label><input type="radio" name="dstatus" value="sunset only"><span>Sunset only</span></label>
        <label><input type="radio" name="dstatus" value="booked"><span>Booked</span></label>
        <label><input type="radio" name="dstatus" value="on call"><span>On call</span></label>
        <label><input type="radio" name="dstatus" value="off"><span>Off</span></label>
      </div>
      <label class="field-lbl" for="day-note">Note <small>shown to customers on open / sunset days</small></label>
      <input type="text" id="day-note" maxlength="200" placeholder="e.g. Calm water expected, great sandbar day">
      <div id="day-bookings" class="day-bookings"></div>
      <div class="sheet-actions">
        <button value="cancel" class="btn btn-ghost" type="submit">Cancel</button>
        <button value="ok" class="btn btn-primary" type="submit">Save Day</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/config.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
